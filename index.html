<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магический шар Бори</title>
  <style>
    :root {
      --bg-color: #0f051d;
      --card-bg: rgba(26, 11, 46, 0.85);
      --accent: #d4af37;
      --accent-hover: #f3e5ab;
      --text-main: #f0e6ff;
      --text-muted: #b19cd9;
    }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 600px;
      padding: 20px;
      box-sizing: border-box;
    }
    .lang-switcher {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 15px;
    }
    .lang-btn {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 5px 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .lang-btn.active, .lang-btn:hover {
      background: var(--accent);
      color: var(--bg-color);
    }
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }
    h1, h2 {
      color: var(--accent);
      text-align: center;
    }
    textarea {
      width: 100%;
      height: 100px;
      background: rgba(15, 5, 29, 0.6);
      border: 1px solid var(--text-muted);
      border-radius: 8px;
      color: var(--text-main);
      padding: 12px;
      box-sizing: border-box;
      resize: none;
      font-size: 16px;
      margin-bottom: 10px;
    }
    textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .btn {
      background: var(--accent);
      color: var(--bg-color);
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
      transition: background 0.3s;
      margin-bottom: 10px;
    }
    .btn:hover {
      background: var(--accent-hover);
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
    }
    .btn-secondary:hover {
      background: rgba(212, 175, 55, 0.1);
      color: var(--accent-hover);
    }
    .media-box {
      text-align: center;
      margin: 20px 0;
      position: relative;
    }
    video {
      width: 100%;
      max-width: 300px;
      border-radius: 12px;
      border: 2px solid var(--accent);
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--accent);
      padding: 30px;
      border-radius: 15px;
      width: 90%;
      max-width: 400px;
      text-align: center;
    }
    .price-tag {
      font-size: 24px;
      color: var(--accent);
      margin: 15px 0;
      font-weight: bold;
    }
    .review-card {
      background: rgba(15, 5, 29, 0.4);
      border-left: 3px solid var(--accent);
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 0 8px 8px 0;
    }
    .review-stars {
      color: var(--accent);
      margin-bottom: 5px;
    }
    .review-name {
      font-size: 12px;
      color: var(--text-muted);
      text-align: right;
    }
  </style>
</head>

<div class="container">
  <!-- Переключатель языка -->
  <div class="lang-switcher">
    <button class="lang-btn active" id="btn-ru" onclick="switchLang('ru')">RU</button>

  </div>

  <!-- Главная карточка гадания -->

    </div>

    <button class="btn" onclick="openPaymentModal('question', 100)" data-i18n="ask_btn">🔮 Получить предсказание</button>
    <button class="btn btn-secondary" id="free-btn" data-i18n="free_btn">📜 Свиток дня (Бесплатно)</button>
  </div>

  <div class="card media-box" id="mediaBox">

      Ваш браузер не поддерживает видео.
    </video>
    <div id="fortune" style="margin-top: 15px; font-style: italic; color: var(--accent);" id="fortune-text"></div>
  </div>

  <!-- Блок отзывов -->
  <div class="card">
    <h2 data-i18n="reviews_title">Отзывы искателей</h2>
    <div id="reviewsContainer">
      <div class="review-card">
        <div class="review-stars">⭐⭐⭐⭐⭐</div>
        <p>«Боря предсказал повышение на работе, и это случилось через неделю! Невероятно!»</p>
        <div class="review-name">— Елена</div>
      </div>
    </div>

    <h3 style="font-size: 16px; margin-top: 20px;" data-i18n="leave_review">Оставить отзыв</h3>
    <form id="reviewForm">
      <input type="text" id="revName" data-i18n-ph="name_ph" placeholder="Ваше имя" style="width:100%; padding:10px; margin-bottom:10px; background:rgba(15,5,29,0.6); border:1px solid var(--text-muted); border-radius:6px; color:white; box-sizing:border-box;">
      <select id="revStars" style="width:100%; padding:10px; margin-bottom:10px; background:rgba(15,5,29,0.6); border:1px solid var(--text-muted); border-radius:6px; color:white;">
        <option value="⭐⭐⭐⭐⭐">5 звезд</option>
        <option value="⭐⭐⭐⭐">4 звезды</option>
        <option value="⭐⭐⭐">3 звезды</option>
      </select>
      <textarea id="revText" data-i18n-ph="review_ph" placeholder="Ваш отзыв..." style="height:60px;"></textarea>
      <button type="submit" class="btn" style="margin-top: 5px;" data-i18n="send_review">Отправить</button>
    </form>
  </div>
</div>

<!-- Модальное окно оплаты -->

      "Soon you will find the answer to a long-standing question.",
      "Your talents will unfold in a brand new way.",
      "Expect joyful news regarding your family.",
      "Time to act! Luck is completely on your side.",
      "Your kindness returns to you in the most wonderful way.",
      "Be ready to accept destiny's gift with an open heart.",
      "Today will bring you a deep sense of satisfaction.",
      "Borya nods: 'You can handle absolutely everything!'",
      "Believe in yourself as much as Borya believes in you!",
      "A grand breakthrough and pure joy lie ahead!"
    ]
  };

  function switchLang(lang) {
    currentLang = lang;
    document.getElementById('btn-ru').classList.toggle('active', lang === 'ru');
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (translations[lang][key]) {
        el.innerText = translations[lang][key];
      }
    });

    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      const key = el.getAttribute('data-i18n-ph');
      if (translations[lang][key]) {
        el.placeholder = translations[lang][key];
      }
    });
  }

  const RUB_GEL = 0.031;
  let currentType = '';
  let currentRubBase = 100;

  const video = document.getElementById('boryaVideo');
  const mediaBox = document.getElementById('mediaBox');

  function openPaymentModal(type, baseRub) {
    if (type === 'question' && !document.getElementById('question').value.trim()) {
      alert(currentLang === 'ru' ? 'Пожалуйста, сначала введите ваш вопрос!' : 'Please enter your question first!');
      return;
    }
    currentType = type;
    currentRubBase = baseRub;

    document.getElementById('rubVal').innerText = baseRub + ' ₽';
    document.getElementById('usdVal').innerText = '$' + (baseRub / 85).toFixed(2);
    document.getElementById('gelVal').innerText = '~' + (baseRub * RUB_GEL).toFixed(2) + ' GEL';

    document.getElementById('payModal').classList.add('active');
  }

  function closePaymentModal() {
    document.getElementById('payModal').classList.remove('active');
  }

  function processPayment(provider) {
    closePaymentModal();
    const q = document.getElementById('question').value.trim();

    if (provider === 'tg_bot') {
      const encodedQ = encodeURIComponent(q || 'Запрос гадания');
      window.open(`https://t.me/BoryaFortuneBot?start=${encodedQ}`, '_blank');
      return;
    }

    const randomFortune = getRandomFortune();
    startBoryaDivination(q ? `[${currentLang === 'ru' ? 'Ответ на вопрос' : 'Answer'}]: "${q}"\n\n✨ ${randomFortune}` : `👑 ${randomFortune}`);
  }

  function getRandomFortune() {
    const arr = fortunesData[currentLang];
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function startBoryaDivination(text) {
    mediaBox.classList.add('playing');
    video.currentTime = 0;
    
    video.play().catch(() => showScrollResult(text));
    video.onended = () => {
      mediaBox.classList.remove('playing');
      showScrollResult(text);
    };
  }

  function showScrollResult(text) {
    document.getElementById('fortune').innerHTML = `<span>${text}</span>`;
    document.getElementById('fortune').scrollIntoView({ behavior: 'smooth' });
  }

  document.getElementById('free-btn').addEventListener('click', () => {
    const randomFortune = getRandomFortune();
    startBoryaDivination(`🎁 [${currentLang === 'ru' ? 'Свиток Дня' : 'Daily Scroll'}]\n\n${randomFortune}`);
  });

  document.getElementById('question').addEventListener('input', (e) => {
    document.getElementById('char-count').textContent = e.target.value.length;
  });

  document.getElementById('reviewForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('revName').value.trim();
    const stars = document.getElementById('revStars').value;
    const text = document.getElementById('revText').value.trim();

    if (!name || !text) return;

    const card = document.createElement('div');
    card.className = 'review-card';
    card.innerHTML = `
      <div class="review-stars">${stars}</div>
      <p>«${text}»</p>
      <div class="review-name">— ${name}</div>
    `;

    const container = document.getElementById('reviewsContainer');
    container.insertBefore(card, container.firstChild);

    document.getElementById('reviewForm').reset();
    alert(currentLang === 'ru' ? 'Спасибо! Ваш отзыв опубликован.' : 'Thank you! Your review has been published.');
  });
</script>
</body>
</html>
